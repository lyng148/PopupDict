<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
        }
        select {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h3>Setting - Cài đặt</h3>
    <label for="lang">Target Language / Ngôn ngữ:</label>

        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
    </select>
    <script src="popup.js"></script>
</body>
</html>
